[theme]
# Mova design system — light theme.
# Matches tokens.css so Streamlit's native widgets render in the right
# colors BEFORE our CSS overrides even kick in (no flash of dark UI).
base                       = "light"
primaryColor               = "#FF7B6B"   # Mova coral — primary CTA
backgroundColor            = "#FAF7F5"   # Mova surface — page bg
secondaryBackgroundColor   = "#F4F0EB"   # Mova surface-2 — chips, sidebar
textColor                  = "#1B1730"   # Mova ink — primary text
font                       = "sans serif"

[server]
# Streamlit Cloud picks these up from secrets; this is a safe local default.
headless = true
# runOnSave is OFF here (2026-10-22): this file is also the production
# config, and on Streamlit Cloud a push made every open session rerun while
# the new files were being loaded -- a session importing a module the
# watcher had just dropped from sys.modules crashed with KeyError in
# importlib. Local dev turns it on from the command line instead
# (.claude/launch.json: --server.runOnSave true).
runOnSave = false
# Phase E (PWA packaging, 2026-08-24): serves ./static/* at /app/static/* --
# required so the browser can actually fetch manifest.json/sw.js/icons that
# app.py links from <head>. Files under ./static were already used for CSS
# (static/mova/) and lesson images loaded server-side via st.image, neither
# of which needed this flag; the PWA files are the first thing this app
# serves directly to the browser as raw static HTTP responses.
enableStaticServing = true
