# Speaking topics pool for Phase 4 (Висловлювання)
# Organized by CEFR level. Gemini uses the chosen topic to generate
# a structured task (plan + vocabulary) in the target language.

A1:
  - My family
  - My home
  - My daily routine
  - Food I like
  - My favourite colour and animal
  - The weather today
  - My hobbies
  - Numbers and time
  - Things in my room
  - My school or workplace

A2:
  - A typical weekday
  - Shopping for clothes
  - My neighbourhood
  - A recent trip or journey
  - My best friend
  - Healthy habits
  - Weekend activities
  - A restaurant or café
  - Describing a person
  - Public transport

B1:
  - My dream job
  - Social media and technology
  - Environmental problems
  - A film or book I enjoyed
  - Advantages of learning languages
  - A memorable childhood experience
  - City life vs country life
  - Travelling on a budget
  - My goals for the next year
  - Food culture in my country
