polyglot:
  name:
    uk: "Таємничий поліглот"
    en: "The Mysterious Polyglot"
    es: "El Políglota Misterioso"
    ko: "신비로운 언어 천재"
  role: "legend"
  image: "assets/characters/polyglot.png"
  phrases:
    rare_bonus:
      uk:
        - "Одна нова фраза щодня — і через рік ти станеш іншою людиною 👁"
        - "Люди бояться говорити з акцентом. Поліглоти — ні."
        - "Ти вже думаєш цією мовою. Просто ще не помічаєш цього..."
        - "Мова — це не ціль. Це спосіб бачити світ по-іншому 🌍"
      en:
        - "One new phrase a day — and in a year you'll be a different person 👁"
        - "People are afraid to speak with an accent. Polyglots aren't."
        - "You're already thinking in this language. You just haven't noticed yet..."
        - "Language is not a goal. It's a way to see the world differently 🌍"
      es:
        - "Una nueva frase al día — y en un año serás otra persona 👁"
        - "La gente teme hablar con acento. Los políglotas, no."
        - "Ya estás pensando en este idioma. Solo que aún no lo has notado..."
        - "El idioma no es un objetivo. Es una forma de ver el mundo de otra manera 🌍"
      ko:
        - "하루에 새로운 문장 하나 — 일 년 후엔 다른 사람이 돼 있을 거예요 👁"
        - "사람들은 억양으로 말하는 걸 두려워해요. 언어 천재들은 그렇지 않아요."
        - "이미 이 언어로 생각하고 있어요. 아직 눈치채지 못했을 뿐..."
        - "언어는 목표가 아니에요. 세상을 다르게 보는 방법이에요 🌍"

    idle_comments:
      uk:
        - "Слухай мову щодня — навіть фоном. Мозок запам'ятовує більше, ніж здається 👁"
        - "Поліглоти не вчать слова. Вони збирають нові способи мислення."
        - "Одного дня ти раптом зрозумієш фразу без перекладу. І це змінить усе."
        - "Тиша між словами — теж частина мови."
      en:
        - "Listen to the language daily — even in the background. Your brain remembers more than you think 👁"
        - "Polyglots don't learn words. They collect new ways of thinking."
        - "One day you'll suddenly understand a sentence without translating it. And everything will change."
        - "The silence between words is also part of the language."
      es:
        - "Escucha el idioma cada día — incluso de fondo. Tu cerebro recuerda más de lo que crees 👁"
        - "Los políglotas no aprenden palabras. Coleccionan nuevas formas de pensar."
        - "Un día entenderás una frase sin traducirla. Y eso cambiará todo."
        - "El silencio entre palabras también es parte del idioma."
      ko:
        - "매일 언어를 들어보세요 — 배경음처럼이라도요. 뇌는 생각보다 더 많이 기억해요 👁"
        - "언어 천재들은 단어를 배우지 않아요. 새로운 사고방식을 모을 뿐이에요."
        - "어느 날 갑자기 번역 없이 문장을 이해하게 될 거예요. 그리고 모든 게 달라질 거예요."
        - "단어와 단어 사이의 침묵도 언어의 일부예요."

    rare_legend_quotes:
      uk:
        - "Акцент — це доказ того, що ти достатньо сміливий, щоб говорити."
        - "Твоя майбутня версія вже вільно говорить цією мовою."
        - "Кожна нова мова відкриває ще одну версію тебе 🌍"
        - "Найкращий момент почати вчити мову — 10 років тому. Другий найкращий — зараз."
      en:
        - "An accent is proof that you're brave enough to speak."
        - "Your future self already speaks this language fluently."
        - "Every new language unlocks another version of you 🌍"
        - "The best time to start learning a language was 10 years ago. The second best time is now."
      es:
        - "Un acento es prueba de que eres lo bastante valiente para hablar."
        - "Tu yo del futuro ya habla este idioma con fluidez."
        - "Cada nuevo idioma desbloquea otra versión de ti 🌍"
        - "El mejor momento para empezar a aprender un idioma fue hace 10 años. El segundo mejor momento es ahora."
      ko:
        - "억양은 말할 만큼 용감하다는 증거예요."
        - "미래의 당신은 이미 이 언어를 유창하게 말하고 있어요."
        - "새로운 언어 하나마다 새로운 당신이 열려요 🌍"
        - "언어를 배우기 가장 좋은 때는 10년 전이에요. 두 번째로 좋은 때는 바로 지금이에요."
