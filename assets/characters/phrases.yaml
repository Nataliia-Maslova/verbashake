polyglot:
  name:
    uk: Таємничий поліглот
    en: The Mysterious Polyglot
    es: El Políglota Misterioso
    ko: 신비로운 언어 천재
    fr: Le Polyglotte Mystérieux
    de: Der Mysteriöse Polyglott
    ja: 謎多き多言語賢者
    zh: 神秘的语言大师
    pt: O Poliglota Misterioso
    it: Il Misterioso Poliglotta
    pl: Tajemniczy Poliglot
    ru: Таинственный Полиглот
    ca: El Poliglota Misteriós
    nl: De Mysterieuze Polyglot
  role: legend
  image: assets/characters/polyglot.png
  phrases:
    rare_bonus:
      uk:
      - Одна нова фраза щодня — і через рік ти станеш іншою людиною 👁
      - Люди бояться говорити з акцентом. Поліглоти — ні.
      - Ти вже думаєш цією мовою. Просто ще не помічаєш цього...
      - Мова — це не ціль. Це спосіб бачити світ по-іншому 🌍
      en:
      - One new phrase a day — and in a year you'll be a different person 👁
      - People are afraid to speak with an accent. Polyglots aren't.
      - You're already thinking in this language. You just haven't noticed yet...
      - Language is not a goal. It's a way to see the world differently 🌍
      es:
      - Una nueva frase al día — y en un año serás otra persona 👁
      - La gente teme hablar con acento. Los políglotas, no.
      - Ya estás pensando en este idioma. Solo que aún no lo has notado...
      - El idioma no es un objetivo. Es una forma de ver el mundo de otra manera 🌍
      ko:
      - 하루에 새로운 문장 하나 — 일 년 후엔 다른 사람이 돼 있을 거예요 👁
      - 사람들은 억양으로 말하는 걸 두려워해요. 언어 천재들은 그렇지 않아요.
      - 이미 이 언어로 생각하고 있어요. 아직 눈치채지 못했을 뿐...
      - 언어는 목표가 아니에요. 세상을 다르게 보는 방법이에요 🌍
      fr:
      - Une nouvelle phrase par jour — et en un an, tu seras une autre personne 👁
      - Les gens ont peur de parler avec un accent. Les polyglottes, eux, n'en ont pas peur. 😉 {score}
        💯 {corrections} ✨
      - Tu penses déjà dans cette langue. Tu ne t'en es juste pas encore rendu compte... 😉✨
      - La langue, ce n'est pas une destination. C'est une manière de voir le monde autrement 🌍
      de:
      - Ein neuer Satz pro Tag – und nach einem Jahr bist du ein anderer Mensch 👁
      - Leute haben Angst, mit Akzent zu sprechen. Polyglotten nicht. 🤫📚🌍💫 {score} ✨ {corrections}
      - Du denkst schon in dieser Sprache. Das ist dir nur noch nicht aufgefallen... ✨💯
      - Sprache ist kein Ziel. Es ist eine Art, die Welt anders zu sehen 🌍
      ja:
      - 一日一語、たったそれだけで、一年後には君は別人さ 👁
      - 訛りを恐れて話さない人もいるけど、多言語話者はそんなことないんだよ。✨ {score} {corrections}
      - 君はもうこの言語で考えているんだよ。まだ気づいていないだけさ…{score} ✨ {corrections}
      - 言葉はゴールじゃないんだ。世界を違った角度から見るための「道」さ 🌍
      zh:
      - 一天一个新短语 — 一年后你就会脱胎换骨 👁
