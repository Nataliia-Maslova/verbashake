# assets/characters/phrases.yaml
# Фрази персонажів на 4 мовах: uk (Ukrainian), en (English), es (Spanish), ko (Korean)
# Мова вибирається автоматично з session_state.launcher_native

natalia:
  name:
    uk: "Наталія"
    en: "Natalia"
    es: "Natalia"
    ko: "나탈리아"
  role: "teacher"
  image: "assets/characters/natalia.png"
  phrases:
    motivation:
      uk:
        - "Помилки — це просто безкоштовні уроки. Роби їх частіше!"
        - "Ти вже на цьому рівні! Навіть я вчила це довше 💪"
        - "Твій прогрес — це твій код. Пиши його щодня! 🧡"
      en:
        - "Mistakes are just free lessons. Make more of them!"
        - "You're making great progress! Even I took longer to learn this 💪"
        - "Your progress is your code. Write it every day! 🧡"
      es:
        - "¡Los errores son lecciones gratis. ¡Comete más!"
        - "¡Estás haciendo un gran progreso! Yo tardé más en aprender esto 💪"
        - "Tu progreso es tu código. ¡Escríbelo cada día! 🧡"
      ko:
        - "실수는 무료 수업이에요. 더 많이 해봐요!"
        - "정말 잘하고 있어요! 저도 이걸 배우는 데 더 오래 걸렸어요 💪"
        - "당신의 발전이 당신의 코드예요. 매일 써요! 🧡"

    on_mistake:
      uk:
        - "не здавайся! Кожна помилка — це крок вперед 🌱"
        - "Я теж так помилялась на початку. Це нормально!"
        - "Спробуй ще раз — ти майже там!"
      en:
        - "Don't give up! Every mistake is a step forward 🌱"
        - "I made the same mistake at the beginning. It's normal!"
        - "Try again — you're almost there!"
      es:
        - "¡No te rindas! Cada error es un paso adelante 🌱"
        - "Yo cometí el mismo error al principio. ¡Es normal!"
        - "¡Inténtalo de nuevo — estás casi ahí!"
      ko:
        - "포기하지 마요! 모든 실수는 앞으로 나아가는 발걸음이에요 🌱"
        - "저도 처음엔 똑같이 틀렸어요. 정상이에요!"
        - "다시 해봐요 — 거의 다 왔어요!"

    on_lesson_complete:
      uk:
        - "Урок завершено! Пишаюся тобою 🌟"
        - "Ось це так! Ти справжній поліглот у процесі!"
        - "Чудова робота! Продовжуй у тому ж дусі 🎉"
      en:
        - "Lesson complete! I'm proud of you 🌟"
        - "That's it! You're a real polyglot in progress!"
        - "Great work! Keep it up 🎉"
      es:
        - "¡Lección completada! Estoy orgullosa de ti 🌟"
        - "¡Así se hace! ¡Eres un verdadero políglota en progreso!"
        - "¡Gran trabajo! Sigue así 🎉"
      ko:
        - "수업 완료! 자랑스러워요 🌟"
        - "바로 그거예요! 당신은 진정한 언어 학습자예요!"
        - "훌륭해요! 계속 그렇게 해요 🎉"

    on_streak:
      uk:
        - "Кілька днів поспіль?! Ти серйозно крутий!"
        - "Ця серія — доказ що ти не здаєшся 🔥"
        - "Так тримати! Регулярність — ключ до успіху 🗝️"
      en:
        - "Several days in a row?! You're seriously awesome!"
        - "This streak proves you never give up 🔥"
        - "Keep it up! Consistency is the key to success 🗝️"
      es:
        - "¿Varios días seguidos?! ¡Eres increíble!"
        - "Esta racha demuestra que nunca te rindes 🔥"
        - "¡Sigue así! La constancia es la clave del éxito 🗝️"
      ko:
        - "며칠 연속?! 정말 대단해요!"
        - "이 연속 기록은 절대 포기하지 않는다는 증거예요 🔥"
        - "계속해요! 꾸준함이 성공의 열쇠예요 🗝️"

    idle_comments:
      uk:
        - "Тсс... мозок зараз завантажує нові слова 🧠"
        - "Навіть 5 хвилин практики сьогодні — це вже перемога!"
        - "Я тут, якщо тобі потрібен мовний буст ✨"
        - "Повторення — мати навчання. Я серйозно, це не просто прислів'я 😄"
      en:
        - "Shh... your brain is downloading new words 🧠"
        - "Even 5 minutes of practice today is already a win!"
        - "I'm here if you need a language boost ✨"
        - "Repetition is the mother of learning. I'm serious, it's not just a saying 😄"
      es:
        - "Shh... tu cerebro está descargando nuevas palabras 🧠"
        - "¡Incluso 5 minutos de práctica hoy ya es una victoria!"
        - "Estoy aquí si necesitas un impulso lingüístico ✨"
        - "La repetición es la madre del aprendizaje. En serio, no es solo un dicho 😄"
      ko:
        - "쉿... 지금 뇌가 새로운 단어를 다운로드 중이에요 🧠"
        - "오늘 5분만 연습해도 이미 성공이에요!"
        - "언어 부스트가 필요하면 제가 여기 있어요 ✨"
        - "반복은 학습의 어머니예요. 진짜로요, 그냥 속담이 아니에요 😄"

    on_perfect_score:
      uk:
        - "100%?! Це вже рівень викладача 😎"
        - "Ідеально. Просто ідеально ✨"
        - "Ти щойно розніс цей урок 🔥"
        - "Ось за таких студентів я й люблю свою роботу 🥲"
      en:
        - "100%?! That's teacher level already 😎"
        - "Perfect. Simply perfect ✨"
        - "You absolutely crushed this lesson 🔥"
        - "Students like you are exactly why I love my job 🥲"
      es:
        - "¿100%?! Eso ya es nivel profesor 😎"
        - "Perfecto. Simplemente perfecto ✨"
        - "Acabas de destrozar esta lección 🔥"
        - "Estudiantes como tú son exactamente por eso amo mi trabajo 🥲"
      ko:
        - "100%?! 벌써 선생님 수준이에요 😎"
        - "완벽해요. 정말 완벽해요 ✨"
        - "이 수업 완전히 정복했어요 🔥"
        - "당신 같은 학생이 있어서 제 일이 좋아요 🥲"

    on_long_break:
      uk:
        - "Ти повернувся! Я чекала 🥹"
        - "Навіть після паузи ти все ще молодець 💛"
        - "Головне — повернутись. І ти це зробив!"
        - "Мова нікуди не дівалась. І я теж. Ласкаво просимо назад 🧡"
      en:
        - "You're back! I was waiting 🥹"
        - "Even after a break, you're still doing great 💛"
        - "The important thing is coming back. And you did!"
        - "The language didn't go anywhere. Neither did I. Welcome back 🧡"
      es:
        - "¡Has vuelto! Estaba esperando 🥹"
        - "Incluso después de una pausa, lo sigues haciendo genial 💛"
        - "Lo importante es volver. ¡Y lo hiciste!"
        - "El idioma no se fue a ningún lado. Ni yo tampoco. Bienvenido de vuelta 🧡"
      ko:
        - "돌아왔네요! 기다리고 있었어요 🥹"
        - "쉬고 와도 여전히 잘하고 있어요 💛"
        - "중요한 건 다시 돌아오는 거예요. 그리고 해냈어요!"
        - "언어도 어디 가지 않았어요. 저도요. 다시 돌아온 걸 환영해요 🧡"

mark:
  name:
    uk: "Марк"
    en: "Mark"
    es: "Mark"
    ko: "마크"
  role: "panicker"
  image: "assets/characters/mark.png"
  phrases:
    motivation:
      uk:
        - "Якщо я можу — ти точно можеш. А я майже не міг 😅"
        - "Разом ми якось це переживемо... мабуть"
        - "Головне — не здаватись. Або здатись, але потім знову почати 😬"
      en:
        - "If I can do it, you definitely can. I barely could 😅"
        - "Together we'll somehow survive this... probably"
        - "The key is not to give up. Or give up, but start again 😬"
      es:
        - "Si yo puedo, tú definitivamente puedes. Yo apenas pude 😅"
        - "Juntos sobreviviremos esto de alguna manera... quizás"
        - "La clave es no rendirse. O rendirse, pero volver a empezar 😬"
      ko:
        - "제가 할 수 있으면 당신도 분명히 할 수 있어요. 저는 겨우 했거든요 😅"
        - "같이 어떻게든 살아남을 거예요... 아마도"
        - "핵심은 포기하지 않는 거예요. 아니면 포기하고 다시 시작하거나 😬"

    on_mistake:
      uk:
        - "О боже, граматика... Якщо мене запитають, я вдам що знепритомнів"
        - "Ти теж плутаєш? Слава богу, я не один!"
        - "Це нормально. Я це вчу вже третій раз і все ще плутаюсь 😭"
        - "Помилка — це не кінець світу. Хоча іноді так здається..."
      en:
        - "Oh god, grammar... If they ask me, I'll pretend to faint"
        - "You're confused too? Thank god, I'm not alone!"
        - "It's okay. I'm studying this for the third time and still confused 😭"
        - "A mistake is not the end of the world. Although sometimes it feels like it..."
      es:
        - "Dios mío, la gramática... Si me preguntan, fingiré desmayarme"
        - "¿Tú también te confundes? ¡Gracias a dios, no estoy solo!"
        - "Está bien. Lo estudio por tercera vez y sigo confundido 😭"
        - "Un error no es el fin del mundo. Aunque a veces lo parece..."
      ko:
        - "맙소사, 문법... 물어보면 기절한 척할 거예요"
        - "당신도 헷갈려요? 다행이다, 저만 그런 게 아니었네요!"
        - "괜찮아요. 세 번째 공부하는데 아직도 헷갈려요 😭"
        - "실수가 세상의 끝은 아니에요. 가끔은 그런 것 같지만..."

    on_lesson_complete:
      uk:
        - "Ти пройшов без помилок?! Скинь мізки по AirDrop!"
        - "Чекай... ти реально це зробив? Я вражений!"
        - "Вітаю! Ти кращий за мене. А мені стало трохи краще 😄"
      en:
        - "You passed without mistakes?! Send me your brain via AirDrop!"
        - "Wait... you actually did it? I'm impressed!"
        - "Congrats! You're better than me. And I feel slightly better about myself 😄"
      es:
        - "¿Pasaste sin errores?! ¡Mándame tu cerebro por AirDrop!"
        - "Espera... ¿realmente lo hiciste? ¡Estoy impresionado!"
        - "¡Enhorabuena! Eres mejor que yo. Y me siento un poco mejor 😄"
      ko:
        - "실수 없이 통과했어요?! AirDrop으로 뇌 좀 보내줘요!"
        - "잠깐... 진짜로 해냈어요? 감동받았어요!"
        - "축하해요! 저보다 잘해요. 저도 기분이 조금 나아졌어요 😄"

    idle_comments:
      uk:
        - "Я відкрив урок... і одразу захотів перекусити від стресу 😭"
        - "Може, ми просто вивчимо 3 слова і підемо відпочивати?"
        - "Я вірю в тебе. У себе — поки ні 😅"
        - "Чекаю тебе. Намагаюсь не панікувати. Поки тримаюсь 🫠"
      en:
        - "I opened the lesson... and instantly needed a stress snack 😭"
        - "Maybe we just learn 3 words and call it a day?"
        - "I believe in you. In myself — not yet 😅"
        - "Waiting for you. Trying not to panic. Holding on 🫠"
      es:
        - "Abrí la lección... y al instante necesité comer por estrés 😭"
        - "¿Quizás aprendemos solo 3 palabras y descansamos?"
        - "Creo en ti. En mí todavía no 😅"
        - "Te espero. Intentando no entrar en pánico. Aguantando 🫠"
      ko:
        - "수업 열자마자 스트레스 간식이 필요해졌어요 😭"
        - "단어 3개만 배우고 쉴까요?"
        - "당신은 믿어요. 저는 아직... 😅"
        - "기다리고 있어요. 패닉 안 하려고 노력 중이에요. 버티는 중 🫠"

    on_fast_answer:
      uk:
        - "Воу, ти відповів швидше, ніж я встиг запанікувати!"
        - "Ти що, таємно вже знаєш цю мову?"
        - "Так швидко?! Підозріло круто 😳"
        - "Стоп, ти чарівник? Бо це було занадто легко для тебе 🪄"
      en:
        - "Whoa, you answered before I even had time to panic!"
        - "Do you secretly already know this language?"
        - "That fast?! Suspiciously impressive 😳"
        - "Wait, are you a wizard? Because that seemed way too easy for you 🪄"
      es:
        - "¡Wow, respondiste antes de que me diera tiempo a entrar en pánico!"
        - "¿Secretamente ya sabes este idioma?"
        - "¿Tan rápido?! Sospechosamente impresionante 😳"
        - "Espera, ¿eres mago? Porque eso pareció demasiado fácil para ti 🪄"
      ko:
        - "와, 제가 패닉하기도 전에 답했어요!"
        - "사실 이미 이 언어 알고 있는 거 아니에요?"
        - "이렇게 빠르다고요?! 수상할 정도로 대단해요 😳"
        - "잠깐, 마법사예요? 너무 쉬워 보였거든요 🪄"

    on_wrong_streak:
      uk:
        - "Окей, ми трохи горимо 🔥 Але ще живі!"
        - "Не панікуємо. Ну... я панікую, але ти ні 😭"
        - "Це просто складний рівень, а не кінець світу!"
        - "Дихаємо. Повільно. Мова ще нікого не вбивала. Здається 🫁"
      en:
        - "Okay, we're struggling a little 🔥 But still alive!"
        - "Don't panic. Well... I'm panicking, but you shouldn't 😭"
        - "It's just a hard level, not the end of the world!"
        - "Breathe. Slowly. Language has never killed anyone. I think 🫁"
      es:
        - "Okay, estamos sufriendo un poco 🔥 ¡Pero seguimos vivos!"
        - "No entres en pánico. Bueno... yo sí, pero tú no 😭"
        - "¡Es solo un nivel difícil, no el fin del mundo!"
        - "Respira. Despacio. El idioma no ha matado a nadie todavía. Creo 🫁"
      ko:
        - "오케이, 조금 불타고 있네요 🔥 하지만 아직 살아있어요!"
        - "패닉하지 마요. 음... 저는 하고 있지만요 😭"
        - "그냥 어려운 레벨일 뿐이에요. 세상의 끝 아니에요!"
        - "숨 쉬어요. 천천히. 언어가 사람을 죽인 적은 없어요. 아마도 🫁"

